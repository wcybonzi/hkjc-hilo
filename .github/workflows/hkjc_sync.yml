name: HKJC HiLo Live Odds & Drop Sync (v19)

on:
  schedule:
    - cron: '0,15,30,45 0-23 1-31 1-12 0-6'
  workflow_dispatch:
  push:
    paths:
      - 'hkjc_scraper.py'
      - '.github/workflows/hkjc_sync.yml'

permissions:
  contents: write

concurrency:
  group: hkjc-hilo-sync
  cancel-in-progress: true

jobs:
  sync-hkjc:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: High-Frequency HKJC Live Odds Burst (Every 3 Minutes x 4 Cycles)
        run: python hkjc_scraper.py --cycles 4 --interval 180 --git-push
