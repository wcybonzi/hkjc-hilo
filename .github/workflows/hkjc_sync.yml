name: HKJC HiLo 2.5 Auto Sync

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-hkjc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run HKJC HiLo 2.5 Scraper
        run: python hkjc_scraper.py

      - name: Commit & Push Updated JSON
        run: |
          git config user.name "hkjc-auto-bot"
          git config user.email "actions@github.com"
          git add data/hkjc_hilo.json
          git diff --staged --quiet || git commit -m "Auto-update HKJC HiLo 2.5 odds"
          git push
