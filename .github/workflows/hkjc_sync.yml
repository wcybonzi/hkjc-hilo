name: HKJC HiLo Live Odds & Drop Sync (v18)

on:
  schedule:
    - cron: '0,15,30,45 0-23 1-31 1-12 0-6'
  workflow_dispatch:
  push:
    paths:
      - 'hkjc_scraper.py'
      - '.github/workflows/hkjc_sync.yml'

permissions:
  contents: write

concurrency:
  group: hkjc-hilo-sync
  cancel-in-progress: true

jobs:
  sync-hkjc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape Full HKJC Slate & Track Dropping Odds
        run: python hkjc_scraper.py

      - name: Commit & Push Updated Odds Without Blocking Manual Edits
        run: |
          git config user.name "hkjc-sync-bot"
          git config user.email "actions@github.com"
          git add data/hkjc_hilo.json
          if git diff --staged --quiet; then
            echo "No odds changes detected in this cycle."
          else
            git commit -m "Auto-sync HKJC HiLo odds & drops (v18)"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
