name: HKJC HiLo 2.5 Auto Sync

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-hkjc-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape Latest HKJC HiLo 2.5 Odds & Official Kickoff Times
        run: python hkjc_scraper.py

      - name: Commit Updated JSON Feed
        run: |
          git config user.name "hkjc-auto-sync-bot"
          git config user.email "actions@github.com"
          git add data/hkjc_hilo.json
          git diff --staged --quiet || git commit -m "chore: auto-sync HKJC HiLo [2.5] odds & kickoff times"
          git push
