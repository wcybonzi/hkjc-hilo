name: HKJC HiLo 2.5 Auto Sync

on:
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-hkjc-and-sofascore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run HKJC + SofaScore multi-source collector
        run: python hkjc_scraper.py

      - name: Commit updated JSON feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hkjc_hilo.json
          git diff --staged --quiet || git commit -m "chore: auto-sync HKJC and SofaScore 2.5 data"
          git push
